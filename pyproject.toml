[project]
name = "querystep"
version = "0.1.0"
description = "EpiKT-driven SQL practice and tutoring"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3"]

[project.optional-dependencies]
kt = ["torch>=2.5,<3", "einops>=0.8,<1", "scikit-learn>=1.5,<2", "scipy>=1.11,<2", "tqdm>=4.66,<5"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1"]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "data_pipeline*", "evals*", "kt*", "tutor*", "course_content*"]

[tool.setuptools.package-data]
course_content = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
